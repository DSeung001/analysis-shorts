name: Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest \
              --title "Latest Build" \
              --notes "Automatically built from the latest main branch commit."
          else
            gh release create latest \
              --title "Latest Build" \
              --notes "Automatically built from the latest main branch commit."
          fi

  build-windows:
    needs: release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Download yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "vendor/yt-dlp.exe"

      - name: Download Deno
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" `
            -OutFile "vendor/deno.zip"
          Expand-Archive "vendor/deno.zip" "vendor/deno-temp" -Force
          Copy-Item "vendor/deno-temp/deno.exe" "vendor/deno.exe"

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/yt-dlp/FFmpeg-Builds/releases/latest"

          $asset = $release.assets |
            Where-Object {
              $_.name -match "win64-gpl\.zip$" -and
              $_.name -notmatch "\.sha256$"
            } |
            Select-Object -First 1

          if (-not $asset) {
            throw "Could not find a Windows x64 FFmpeg archive."
          }

          Invoke-WebRequest `
            -Uri $asset.browser_download_url `
            -OutFile "vendor/ffmpeg.zip"

          Expand-Archive "vendor/ffmpeg.zip" "vendor/ffmpeg-temp" -Force

          $ffmpeg = Get-ChildItem "vendor/ffmpeg-temp" -Recurse -Filter "ffmpeg.exe" |
            Select-Object -First 1
          $ffprobe = Get-ChildItem "vendor/ffmpeg-temp" -Recurse -Filter "ffprobe.exe" |
            Select-Object -First 1

          if (-not $ffmpeg -or -not $ffprobe) {
            throw "FFmpeg binaries were not found in the archive."
          }

          Copy-Item $ffmpeg.FullName "vendor/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "vendor/ffprobe.exe"

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "ShortsFrameExtractor" `
            --add-binary "vendor/yt-dlp.exe;tools" `
            --add-binary "vendor/deno.exe;tools" `
            --add-binary "vendor/ffmpeg.exe;tools" `
            --add-binary "vendor/ffprobe.exe;tools" `
            app.py

      - name: Smoke test artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ShortsFrameExtractor.exe")) {
            throw "Build output does not exist."
          }

          $size = (Get-Item "dist/ShortsFrameExtractor.exe").Length
          if ($size -lt 10MB) {
            throw "Build output is unexpectedly small."
          }

      - name: Upload EXE to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest `
            "dist/ShortsFrameExtractor.exe" `
            --clobber

  build-macos:
    needs: release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Download yt-dlp
        run: |
          mkdir -p vendor
          curl -fL \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" \
            -o vendor/yt-dlp
          chmod +x vendor/yt-dlp

      - name: Download Deno
        run: |
          curl -fL \
            "https://github.com/denoland/deno/releases/latest/download/deno-aarch64-apple-darwin.zip" \
            -o vendor/deno.zip
          unzip -o -q vendor/deno.zip -d vendor/deno-temp
          cp vendor/deno-temp/deno vendor/deno
          chmod +x vendor/deno

      - name: Download FFmpeg
        run: |
          curl -fL \
            "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip" \
            -o vendor/ffmpeg.zip
          curl -fL \
            "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip" \
            -o vendor/ffprobe.zip
          unzip -o -q vendor/ffmpeg.zip -d vendor
          unzip -o -q vendor/ffprobe.zip -d vendor
          test -f vendor/ffmpeg || { echo "ffmpeg missing"; exit 1; }
          test -f vendor/ffprobe || { echo "ffprobe missing"; exit 1; }
          chmod +x vendor/ffmpeg vendor/ffprobe

      - name: Build app bundle
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "ShortsFrameExtractor" \
            --target-architecture arm64 \
            --add-binary "vendor/yt-dlp:tools" \
            --add-binary "vendor/deno:tools" \
            --add-binary "vendor/ffmpeg:tools" \
            --add-binary "vendor/ffprobe:tools" \
            app.py

      - name: Package app bundle
        run: |
          test -d "dist/ShortsFrameExtractor.app" || { echo "App bundle missing"; exit 1; }
          ditto -c -k --keepParent \
            "dist/ShortsFrameExtractor.app" \
            "dist/ShortsFrameExtractor-macos-arm64.zip"
          size=$(stat -f%z "dist/ShortsFrameExtractor-macos-arm64.zip")
          if [ "$size" -lt 10000000 ]; then
            echo "Build output is unexpectedly small ($size bytes)."
            exit 1
          fi

      - name: Upload app bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload latest \
            "dist/ShortsFrameExtractor-macos-arm64.zip" \
            --clobber
